<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button default-href="/dashboard" text="Dashboard"></ion-back-button>
      <ion-item>
      <ion-button size="small" shape="round" (click)="openFilterPopup($event)">
        <ion-icon name="filter"></ion-icon>
      </ion-button>
      @if(badgefilter() > 0){
      <ion-badge>{{badgefilter()}}</ion-badge>
      }
      </ion-item>
    </ion-buttons>
    <ion-title align="center">Valutazioni</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      @for(evaluation of evaluationsList(); track $index){
        <ion-col size="12" size-sm="6" size-md="4" size-lg="3">
          <ion-card>
            <ion-card-header>
              <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <ion-card-title style="font-size: 1.1rem; padding-right: 8px;">{{ evaluation.description }}</ion-card-title>
                <ion-button fill="clear" color="medium" (click)="presentActionSheet(evaluation)" style="margin: -10px -10px 0 0;">
                  <ion-icon slot="icon-only" name="ellipsis-vertical"></ion-icon>
                </ion-button>
              </div>
            </ion-card-header>
            <ion-card-content>
              <p><strong>Data:</strong> {{ evaluation.data | date : 'dd/MM/yyyy'}}</p>
              <p><strong>Griglia:</strong> {{ evaluation.grid?.descrizione }}</p>
            </ion-card-content>
          </ion-card>
        </ion-col>
      }
    </ion-row>
  </ion-grid>
</ion-content>
