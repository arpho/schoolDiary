<ion-header [translucent]="true">

  <ion-buttons slot="start">
    <ion-back-button defaultHref="/dashboard"></ion-back-button>
  </ion-buttons>

  <ion-toolbar>    
    <ion-title align="center">Valutazioni per lo studente {{student().lastName}} {{student().firstName}}</ion-title>
    
    <ion-buttons slot="end" *ngIf="classKey">
      <ion-button [disabled]="!prevStudentKey()" (click)="prevStudentKey() && goToStudent(prevStudentKey()!)" title="Studente Precedente">
        <ion-icon name="chevron-back"></ion-icon>
      </ion-button>
      <ion-button [disabled]="!nextStudentKey()" (click)="nextStudentKey() && goToStudent(nextStudentKey()!)" title="Studente Successivo">
        <ion-icon name="chevron-forward"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>



<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">evaluations4Student</ion-title>
    </ion-toolbar>
  </ion-header>
  <app-evaluation4-student [studentkey]="student().key" [teacherkey]="teacherKey"></app-evaluation4-student>
</ion-content>
