<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button
        text="Indietro"
        class="back-button"
        defaultHref="/users-list"
        (click)="dismiss()"
        autoHide="true">
      </ion-back-button>
      <ion-button fill="clear" (click)="toggleSidebar()">
        <ion-icon name="menu"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title align="center">{{ nomeStudente() }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content id="main-content">
  <div class="content-wrapper">

    <!-- Sidebar laterale -->
    <div class="sidebar" [class.sidebar-open]="sidebarOpen()">
      <div class="sidebar-header">
        <h3>Sezioni</h3>
        <ion-button fill="clear" size="small" (click)="toggleSidebar()">
          <ion-icon name="close"></ion-icon>
        </ion-button>
      </div>
      <div class="sidebar-content">
        <ion-item button (click)="selectTab('generalita')" [class.active]="selectedTab() === 'generalita'">
          <ion-icon name="person" slot="start"></ion-icon>
          <ion-label>Generalità</ion-label>
        </ion-item>
        <ion-item button (click)="selectTab('disabilita')" [class.active]="selectedTab() === 'disabilita'">
          <ion-icon name="accessibility-outline" slot="start"></ion-icon>
          <ion-label>Disabilità & PDP</ion-label>
        </ion-item>
        <ion-item button (click)="selectTab('note')" [class.active]="selectedTab() === 'note'">
          <ion-icon name="document-text" slot="start"></ion-icon>
          <ion-label>Note</ion-label>
        </ion-item>
        <ion-item button (click)="selectTab('valutazioni')" [class.active]="selectedTab() === 'valutazioni'">
          <ion-icon name="sparkles" slot="start"></ion-icon>
          <ion-label>Valutazioni</ion-label>
        </ion-item>
      </div>
    </div>

    <!-- Overlay per chiudere la sidebar -->
    <div class="sidebar-overlay" [class.visible]="sidebarOpen()" (click)="toggleSidebar()"></div>

    <!-- Contenuto principale -->
    <div class="main-content">

      @if (selectedTab() === 'generalita') {
        <app-student-avatar
          [userKey]="userKey"
          [photoUrl]="user().photoUrl"
          [firstName]="user().firstName"
          [lastName]="user().lastName"
          (photoChanged)="onPhotoChanged($event)">
        </app-student-avatar>
        <app-user-generalities2 [user]="user()"></app-user-generalities2>
      }

      @if (selectedTab() === 'disabilita') {
        <app-student-disability
          [dva]="user().DVA"
          [dsa]="user().DSA"
          [bes]="user().BES"
          [adhd]="user().ADHD"
          [noteDisabilita]="user().noteDisabilita"
          [pdpList]="user().pdpUrl"
          (dataChanged)="onDisabilityChanged($event)">
        </app-student-disability>
      }

      @if (selectedTab() === 'note') {
        <app-reserved-notes4student
          [studentkey]="userKey"
          [ownerkey]="loggedUser().key">
        </app-reserved-notes4student>
      }

      @if (selectedTab() === 'valutazioni') {
        <app-evaluation4-student
          [studentkey]="userKey"
          [teacherkey]="loggedUser().key">
        </app-evaluation4-student>
      }

    </div>
  </div>
</ion-content>
