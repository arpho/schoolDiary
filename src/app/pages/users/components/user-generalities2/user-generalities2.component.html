<ion-content [fullscreen]="true" class="ion-padding">
  <form [formRoot]="userForm">

    <!-- ─── SEZIONE ANAGRAFICA ─────────────────────────────── -->
    <div class="section-title">
      <ion-icon name="person-outline"></ion-icon>
      <span>Dati Anagrafici</span>
    </div>

    <ion-grid class="form-grid">
      <ion-row>
        <!-- Nome -->
        <ion-col size="12" size-md="6">
          <ion-input
            class="custom-input"
            fill="outline"
            labelPlacement="floating"
            label="Nome *"
            [formField]="userForm.firstName"
            type="text">
          </ion-input>
        </ion-col>

        <!-- Cognome -->
        <ion-col size="12" size-md="6">
          <ion-input
            class="custom-input"
            fill="outline"
            labelPlacement="floating"
            label="Cognome *"
            [formField]="userForm.lastName">
          </ion-input>
        </ion-col>

        <!-- Nickname -->
        <ion-col size="12" size-md="6">
          <ion-input
            class="custom-input"
            fill="outline"
            labelPlacement="floating"
            label="Nickname"
            [formField]="userForm.userName">
          </ion-input>
        </ion-col>

        <!-- Email -->
        <ion-col size="12" size-md="6">
          <div style="display: flex; align-items: center;">
            <ion-input
              class="custom-input"
              style="flex: 1;"
              fill="outline"
              labelPlacement="floating"
              label="Email *"
              [formField]="userForm.email"
              type="email">
            </ion-input>
            <ion-button fill="clear" (click)="regenerateEmail()" title="Rigenera Email" style="margin-top: -4px;">
              <ion-icon name="refresh-outline" slot="icon-only"></ion-icon>
            </ion-button>
          </div>
        </ion-col>

        <!-- Telefono -->
        <ion-col size="12" size-md="6">
          <ion-input
            class="custom-input"
            fill="outline"
            labelPlacement="floating"
            label="Telefono"
            [formField]="userForm.phoneNumber"
            type="tel">
          </ion-input>
        </ion-col>

        <!-- Data di nascita -->
        <ion-col size="12" size-md="6">
          <ion-input
            class="custom-input"
            fill="outline"
            labelPlacement="floating"
            label="Data di nascita"
            [formField]="userForm.birthDate"
            type="date">
          </ion-input>
        </ion-col>
      </ion-row>
    </ion-grid>

    <!-- ─── SEZIONE RUOLO E CLASSI ────────────────────────── -->
    <div class="section-title">
      <ion-icon name="school-outline"></ion-icon>
      <span>Ruolo & Classi</span>
    </div>

    <ion-grid class="form-grid">
      <ion-row>
        <ion-col size="12" size-md="6">
          <ion-select
            class="custom-input"
            fill="outline"
            labelPlacement="floating"
            label="Ruolo"
            [formField]="userForm.role">
            @for (role of rolesValue; track $index) {
              <ion-select-option [value]="role">{{ $UsersRole[role] }}</ion-select-option>
            }
          </ion-select>
        </ion-col>

        <ion-col size="12" size-md="6">
          <ion-select
            class="custom-input"
            fill="outline"
            labelPlacement="floating"
            label="Classe principale"
            [formField]="userForm.classKey">
            @for (classe of elencoClassi(); track classe.key) {
              <ion-select-option [value]="classe.key">{{ classe.classe }}</ion-select-option>
            }
          </ion-select>
        </ion-col>

        <ion-col size="12">
          <div class="classes-field-wrapper">
            <p class="classes-label">Tutte le classi assegnate</p>
            <app-classes-field
              [classes]="usersClasses()"
              (classeschange)="onClassesChange($event)">
            </app-classes-field>
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>

  </form>
</ion-content>

<ion-footer>
  <ion-fab vertical="bottom" horizontal="end">
    <ion-fab-button (click)="save()" (keydown.enter)="save()" [disabled]="!userForm().valid">
      <ion-icon name="save"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-footer>
