<div class="avatar-wrapper">
  <!-- Input file nascosto -->
  <input #fileInput type="file" accept="image/*" style="display:none"
    (change)="onFileSelected($event)">

  <!-- Avatar: foto o iniziali -->
  <div class="avatar-circle" [style.background]="photoUrl() ? 'transparent' : avatarColor"
    (click)="openFilePicker()" title="Clicca per cambiare foto">
    @if (photoUrl()) {
      <img [src]="photoUrl()" alt="Foto studente" class="avatar-img">
    } @else {
      <span class="avatar-initials">{{ initials }}</span>
    }
    <div class="avatar-overlay">
      <ion-icon name="camera-outline"></ion-icon>
    </div>
  </div>

  <!-- Nome sotto l'avatar -->
  <p class="avatar-name">{{ lastName() }} {{ firstName() }}</p>
</div>

<!-- Modal Cropper -->
<ion-modal [isOpen]="cropperOpen()" (didDismiss)="closeCropper()">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button (click)="closeCropper()">
            <ion-icon name="close-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-buttons>
        <ion-title>Ritaglia Foto</ion-title>
        <ion-buttons slot="end">
          <ion-button [disabled]="!croppedBlob() || uploading()" (click)="confirmCrop()">
            @if (uploading()) {
              <ion-spinner name="crescent"></ion-spinner>
            } @else {
              <ion-icon name="checkmark-outline" slot="icon-only"></ion-icon>
            }
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <div class="cropper-container">
        @if (imageChangedEvent()) {
          <image-cropper
            [imageChangedEvent]="imageChangedEvent()"
            [maintainAspectRatio]="true"
            [aspectRatio]="1"
            [roundCropper]="true"
            format="jpeg"
            outputType="blob"
            (imageCropped)="imageCropped($event)">
          </image-cropper>
        }
      </div>
      <p class="crop-hint">Trascina per riposizionare · Pizzica per ridimensionare</p>
    </ion-content>
  </ng-template>
</ion-modal>
